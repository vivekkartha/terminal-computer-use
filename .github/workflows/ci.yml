name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Script --help smoke tests
        run: bash tests/test_scripts_help.sh

      - name: fs-organize unit test
        run: python3 tests/test_fs_smart_organize.py

      - name: fs-move spaces + bash 3.2
        run: bash tests/test_fs_move.sh

      - name: install.sh dry-run + unmanaged protect
        run: bash tests/test_install_dry.sh

      - name: doctor
        run: bash skills/computer/scripts/doctor.sh

      - name: release smoke
        run: bash tests/smoke_release.sh

      - name: Shellcheck (best-effort)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -x install.sh skills/computer/scripts/lib/*.sh \
            skills/computer/scripts/doctor.sh \
            skills/computer/scripts/fs-move.sh \
            skills/computer/scripts/fs-copy.sh \
            skills/computer/scripts/safe-trash.sh \
            skills/computer/scripts/which-tools.sh || true
